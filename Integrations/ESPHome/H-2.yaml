substitutions:
  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/H-2"
  beta_manifest_base: "https://github.com/ApolloAutomation/H-2/releases/download/beta-fw"
  ota_stable_manifest: "${stable_manifest_base}/firmware/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-standard.json"
  # Bluetooth Proxy switch state on a device with no stored preference yet.
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  name: "apollo-h-2"
  friendly_name: Apollo H-2
  comment: Apollo H-2
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-2"
    version: "${version}"

  # improv_ble (renamed from esp32_improv) needs 2026.10
  min_version: 2026.10.0
  on_boot:
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |- 
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                  id(deep_sleep_1).prevent_deep_sleep(); 
    # Check button states for powered-off scenario
    - priority: -100
      then:
      - lambda: |-
          uint64_t wake = esp_sleep_get_ext1_wakeup_status();
          
          // Only process deep sleep wake if we actually woke from deep sleep
          if (wake != 0) {
            uint32_t low = wake % 0xFFFFFFFF;
            uint32_t high = (wake >> 32) % 0xFFFFFFFF;
            
            ESP_LOGI("Apollo", "Deep sleep wake detected, wake status: 0x%llx", wake);
            
            // Check which song button caused the wake-up
            if ((low) & (1<<(4))) {
              id(wakeup_button_pressed).publish_state("1");
              id(btn_play_song_1).press();
            }
            else if ((low) & (1<<(5))) {
              id(wakeup_button_pressed).publish_state("2");
              id(btn_play_song_2).press();
            }
            else if ((low) & (1<<(6))) {
              id(wakeup_button_pressed).publish_state("3");
              id(btn_play_song_3).press();
            }
            else if ((low) & (1<<(7))) {
              id(wakeup_button_pressed).publish_state("4");
              id(btn_play_song_4).press();
            }
            else {
              id(wakeup_button_pressed).publish_state("0");
            }
          }
          else {
            // If no deep sleep wake and no button was detected in powered-off scenario
            // then set to "0" (no button press)
            if (id(wakeup_button_pressed).state == "") {
              ESP_LOGI("Apollo", "No wake source detected, setting to 0");
              id(wakeup_button_pressed).publish_state("0");
            }
          }
    - priority: -100
      then:
        - script.execute: apply_ota_source
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
  on_shutdown:
    - light.turn_off: rgb_light

dashboard_import:
  package_import_url: github://ApolloAutomation/H-2/Integrations/ESPHome/H-2.yaml
  import_full_config: false

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

improv_ble:
  authorizer: none

improv_serial:

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: ${ota_stable_manifest}

wifi:
  on_connect:
    - component.update: firmware_update
  power_save_mode: HIGH
  output_power: 10
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo H2 Hotspot"

logger:

captive_portal:

web_server:
  port: 80
  version: 3

api:
  encryption:
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - service: play_song_1
      then:
        - script.execute: play_song_1
    - service: play_song_2
      then:
        - script.execute: play_song_2
    - service: play_song_3
      then:
        - script.execute: play_song_3
    - service: play_song_4
      then:
        - script.execute: play_song_4
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |- 
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
      - component.update: wakeup_button_pressed
switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: ${bluetooth_proxy_restore_mode}
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |- 
                  id(deep_sleep_1).allow_deep_sleep();

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:  
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

button:
  - platform: template
    name: "Firmware Update"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: "config"
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      # OTA download needs the device awake for its whole duration.
      - lambda: |-
          id(deep_sleep_1).prevent_deep_sleep();
      - delay: 3s
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      # The manifest fetch runs in its own task; give it a fixed window to land
      # (update.is_available stays false for same-version switches).
      - delay: 5s
      - lambda: id(firmware_update).perform(true);
      # Only reached if the update did not start (e.g. manifest unreachable).
      # Re-arm deep sleep unless something else is holding the device awake.
      - if:
          condition:
            and:
              - switch.is_off: prevent_sleep
              - binary_sensor.is_off: ota_mode
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();

text_sensor:
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

script:
  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          const char *url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url);
          id(firmware_update).set_source_url(url);
      - component.update: firmware_update

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 40%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 40%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 40%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else: 
            - deep_sleep.enter:
                id: deep_sleep_1
                
  - id: play_song_1
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 90%
                effect: "RainbowWave"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "RainbowWave"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 70%
                effect: "RainbowWave"
          else:
            - light.turn_on:
                id: logo_light
                effect: "RainbowWave"
      - wifi.disable: 
      - rtttl.play:
          rtttl: !lambda 'return id(song_1).state;'
      - wifi.enable:  
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_2
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 90%
                effect: "TwinklingWhite"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "TwinklingWhite"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 80%
                effect: "TwinklingRed"
          else:
            - light.turn_on:
                id: logo_light
                effect: "TwinklingRed"
      - wifi.disable:           
      - rtttl.play:
          rtttl: !lambda 'return id(song_2).state;'
      - wifi.enable: 
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_3
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 90%
                effect: "RedGreen"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "RedGreen"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 70%
                effect: "RedGreen"
          else:
            - light.turn_on:
                id: logo_light
                effect: "RedGreen"
      - wifi.disable:           
      - rtttl.play:
          rtttl: !lambda 'return id(song_3).state;'
      - wifi.enable: 
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_4
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 90%
                effect: "TwinklingBlues"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "TwinklingBlues"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 80%
                effect: "TwinklingBlues"
          else:
            - light.turn_on:
                id: logo_light
                effect: "TwinklingBlues"
      - wifi.disable: 
      - rtttl.play:
          rtttl: !lambda 'return id(song_4).state;'
      - wifi.enable: 
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_x
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "Sandstorm"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "Sandstorm"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 60%
                effect: "Sandstorm"
          else:
            - light.turn_on:
                id: logo_light
                effect: "Sandstorm"
      - wifi.disable:
      - rtttl.play:
          rtttl: Sandstorm:d=16,o=6,b=85:e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e, 8e,e,a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e, a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e,a,e, e,e,e,8e,e,d,e
      - wifi.enable:
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

packages:
  core: !include Core.yaml
