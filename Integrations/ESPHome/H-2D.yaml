esphome:
  name: "apollo-h-2d"
  friendly_name: Apollo H-2D
  comment: Apollo H-2D
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-2D"
    version: "${version}"

  min_version: 2026.8.0
  on_boot:
    - priority: 500
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                  id(deep_sleep_1).prevent_deep_sleep();
    
    # Check button states for powered-off scenario
    - priority: -100
      then:
      - lambda: |-
          uint64_t wake = esp_sleep_get_ext1_wakeup_status();
          
          // Only process deep sleep wake if we actually woke from deep sleep
          if (wake != 0) {
            uint32_t low = wake % 0xFFFFFFFF;
            uint32_t high = (wake >> 32) % 0xFFFFFFFF;
            
            ESP_LOGI("Apollo", "Deep sleep wake detected, wake status: 0x%llx", wake);
            
            // Check which song button caused the wake-up
            if ((low) & (1<<(4))) {
              id(wakeup_button_pressed).publish_state("1");
              id(btn_play_song_1).press();
            }
            else if ((low) & (1<<(5))) {
              id(wakeup_button_pressed).publish_state("2");
              id(btn_play_song_2).press();
            }
            else if ((low) & (1<<(6))) {
              id(wakeup_button_pressed).publish_state("3");
              id(btn_play_song_3).press();
            }
            else if ((low) & (1<<(7))) {
              id(wakeup_button_pressed).publish_state("4");
              id(btn_play_song_4).press();
            }
            else {
              id(wakeup_button_pressed).publish_state("0");
            }
          }
          else {
            // If no deep sleep wake and no button was detected in powered-off scenario
            // then set to "0" (no button press)
            if (id(wakeup_button_pressed).state == "") {
              ESP_LOGI("Apollo", "No wake source detected, setting to 0");
              id(wakeup_button_pressed).publish_state("0");
            }
          }
    
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"
  on_shutdown:
    - light.turn_off: rgb_light

safe_mode:

logger:

switch:
  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: ALWAYS_OFF
    optimistic: true
    entity_category: "config"

script:
  - id: statusCheck
    then:
      - light.turn_on: 
          id: rgb_light
          brightness: 40%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else: 
            - deep_sleep.enter:
                id: deep_sleep_1
  - id: play_song_1
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "RainbowWave"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "RainbowWave"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 60%
                effect: "RainbowWave"
          else:
            - light.turn_on:
                id: logo_light
                effect: "RainbowWave"
      - rtttl.play:
          rtttl: !lambda 'return id(song_1).state;'
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep
      
  - id: play_song_2
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "TwinklingWhite"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "TwinklingWhite"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 80%
                effect: "TwinklingRed"
          else:
            - light.turn_on:
                id: logo_light
                effect: "TwinklingRed"
      - rtttl.play:
          rtttl: !lambda 'return id(song_2).state;'
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_3
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "RedGreen"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "RedGreen"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 60%
                effect: "RedGreen"
          else:
            - light.turn_on:
                id: logo_light
                effect: "RedGreen"
      - rtttl.play:
          rtttl: !lambda 'return id(song_3).state;'
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_4
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "TwinklingBlues"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "TwinklingBlues"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 80%
                effect: "TwinklingBlues"
          else:
            - light.turn_on:
                id: logo_light
                effect: "TwinklingBlues"
      - rtttl.play:
          rtttl: !lambda 'return id(song_4).state;'
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep

  - id: play_song_x
    then:
      - if:
          condition:
            lambda: 'return !id(rgb_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 80%
                effect: "Sandstorm"
          else:
            - light.turn_on:
                id: rgb_light
                effect: "Sandstorm"
      - if:
          condition:
            lambda: 'return !id(logo_light).remote_values.is_on();'
          then:
            - light.turn_on:
                id: logo_light
                brightness: 60%
                effect: "Sandstorm"
          else:
            - light.turn_on:
                id: logo_light
                effect: "Sandstorm"
      - rtttl.play:
          rtttl: Sandstorm:d=16,o=6,b=85:e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e, 8e,e,a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e, a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e,a,e, e,e,e,8e,e,d,e
      - delay: 30s
      - light.turn_off: rgb_light
      - light.turn_off: logo_light
      - script.execute: ShouldSleep      

packages:
  core: !include Core.yaml